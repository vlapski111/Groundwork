<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1118"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Groundwork">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Groundwork Strength</title>
<style>:root{--bg:#0d1118;--bg2:#121824;--card:#171e2b;--card2:#1f2838;--line:#27324a;--text:#eef1f6;--mut:#8f9ab2;--dim:#5e6b87;--ac:#ff6a2b;--ac2:#ffb54a;--teal:#2fd3be;--ok:#4ade80;--bad:#ff5d5d;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4}
h1,h2,p,ol,ul{margin:0}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(150px + var(--sb))}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 2px 6px}
header.top b{font-size:21px;font-weight:800;letter-spacing:-.02em}header.top b i{font-style:normal;color:var(--ac)}
header.top span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px;margin-bottom:10px;letter-spacing:-.01em}
.sec-h span{font-weight:500;font-size:12px;color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* hero */
.hero{display:flex;gap:10px;align-items:center;background:linear-gradient(160deg,#1b2436,#141b29);overflow:hidden}
.hero-l{flex:1;min-width:0}.hero-l h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0}.hero-l p{color:var(--mut);font-size:14px}
.hero .row{margin-top:12px}.hero-r{width:128px;flex:none}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600}
.streak{font-size:12px;color:var(--ac2);font-weight:700}
.mm svg{width:100%;height:auto;display:block}
.mm .mmlab,.mmbig .mmlab,.mmwrap .mmlab{fill:#5e6b87;font:700 8px sans-serif;letter-spacing:.14em}
.mmbig{max-width:340px;margin:0 auto}.mmwrap{max-width:300px;margin:0 auto}
.hl.p{filter:drop-shadow(0 0 3px rgba(255,106,43,.75));animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px;font-size:11px;color:var(--mut)}
.legend i{width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,#323c54,rgba(255,106,43,.35),#ff6a2b)}
/* time */
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.presets button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;min-width:50px}
.presets button.wide{flex:1;min-width:130px;color:var(--ac2)}
.presets button:active{background:var(--ac);color:#1a0a02}
.srow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.srow .slab{flex:1;min-width:0}.slab b{display:block;font-size:15px}.slab span{font-size:12px;color:var(--mut)}
.srow.done{opacity:.55}.sdone{color:var(--ok);font-size:13px;font-weight:700}
.step{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.step button{width:40px;height:40px;font-size:22px;font-weight:700;color:var(--ac2)}
.step b{min-width:62px;text-align:center;font-size:15px}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;color:var(--mut)}
.x{width:32px;height:32px;border-radius:50%;color:var(--dim);font-size:15px}
.addline{width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--mut);font-weight:600;margin-top:4px}
/* sessions */
.sess{padding:0;overflow:hidden}
.sess header{display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer}
.sess header b{font-size:16px}.sess header span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.chev{width:10px;height:10px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:.2s;margin-right:6px}
.sess.open .chev{transform:rotate(-135deg)}
.sess .list{display:none;padding:0 10px 10px}.sess.open .list{display:block}
.ex{display:flex;gap:10px;align-items:center;padding:8px;margin-top:6px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.ex .th{width:104px;height:78px;flex:none;border-radius:10px;background:#101520;overflow:hidden}
.th svg{width:100%;height:100%;display:block}
.ex .tx{flex:1;min-width:0}.ex .tx b{display:block;font-size:15px;line-height:1.2}.ex .tx b em{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-left:4px;font-weight:700}
.ex .tx>span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}.ex .tx .w{color:var(--ac2);font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.chips.c{justify-content:center}
.chip{font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--mut);font-weight:700}
.chip.p{background:rgba(255,106,43,.16);color:#ff8a57}.chip.s{background:rgba(255,181,74,.13);color:var(--ac2)}
.swap{width:36px;height:36px;border-radius:50%;background:var(--card2);color:var(--mut);font-size:17px;flex:none}
.donecard h2{font-size:20px;color:var(--ok)}.donecard p{color:var(--mut);margin-top:6px;font-size:14px}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--sb));width:min(530px,calc(100% - 28px));height:56px;border-radius:16px;background:var(--ac);color:#1a0a02;font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(255,106,43,.35);z-index:30}
/* buttons */
.btn{display:block;width:100%;border-radius:16px;background:var(--ac);color:#1a0a02;font-weight:800;font-size:17px;padding:16px}
.btn.big{height:58px;padding:0;margin-top:12px}
.primary{background:var(--ac);color:#1a0a02;border-radius:12px;padding:12px 16px;font-weight:800;flex:1}
.ghost{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;flex:1}
.danger{color:var(--bad)}
.link{color:var(--mut);font-size:13px;padding:10px 12px;font-weight:600}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(13,17,24,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb));z-index:40}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:700}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
/* plan */
.rot{display:flex;align-items:center;gap:10px;padding:10px;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;position:relative;cursor:pointer}
.rot.next{border-color:var(--ac);box-shadow:0 0 0 1px rgba(255,106,43,.3) inset}
.rn{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--mut);flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:16px}.rt span{display:block;font-size:12.5px;color:var(--mut)}.rt .lastdone{color:var(--dim);margin-top:2px}
.rm{width:84px;flex:none}.badge{position:absolute;top:8px;right:10px;font-style:normal;font-size:10px;font-weight:800;background:var(--ac);color:#1a0a02;padding:2px 8px;border-radius:8px}
.rot .rm{margin-left:auto}.rot.next .rm{margin-top:14px}
.tip{padding:12px;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.tip b{display:block;font-size:14.5px}.tip span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
/* progress */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:800}.stats span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sum .stats{grid-template-columns:repeat(3,1fr)}
.trk{padding:12px 0;border-top:1px solid var(--line)}.trk:first-of-type{border-top:0}
.trk-h{display:flex;gap:10px;align-items:center}.trk-h .th{width:96px;height:72px;flex:none;border-radius:10px;background:#101520;overflow:hidden}
.trk-h b{display:block}.trk-h span{font-size:12.5px;color:var(--mut)}
.steps{list-style:none;padding:0;display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 6px}
.steps li{font-size:11px;padding:4px 9px;border-radius:10px;background:var(--card2);color:var(--dim);font-weight:700}
.steps li.d{color:var(--ok);background:rgba(74,222,128,.1)}.steps li.c{background:var(--ac);color:#1a0a02}
.up{font-size:13px;color:var(--mut);margin:6px 0 10px}.up b{color:var(--text)}
.pb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pb:first-of-type{border-top:0}.pb small{color:var(--dim);margin-left:4px}.pb b{color:var(--ac2);font-weight:700;text-align:right}
.gear{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.gear>div:first-child{min-width:0}.gear b{display:block;font-size:15px}.gear span{font-size:12.5px;color:var(--mut)}
.tog{width:50px;height:30px;border-radius:15px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.2s}
.tog.on{background:var(--ac);border-color:var(--ac)}.tog.on i{left:23px;background:#fff}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .panel{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--sb));border:1px solid var(--line);border-bottom:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:20px;letter-spacing:-.02em}
.bigfig{background:#101520;border-radius:14px;overflow:hidden;margin-bottom:12px;aspect-ratio:4/3}
.bigfig svg{width:100%;height:100%}
.cues{padding-left:20px;margin-top:6px}.cues li{margin:6px 0;font-size:14.5px}
.cues.short{list-style:none;padding:0;margin:8px 0}.cues.short li{font-size:13.5px;color:var(--mut);margin:3px 0;text-align:center}
.facts{display:flex;gap:10px;margin-top:10px}.facts div{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.facts b{display:block;font-size:15px}.facts span{font-size:11px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);background:var(--bg2);border-left:3px solid var(--ac);padding:8px 10px;border-radius:8px;margin-top:10px}
.ex.alt{margin-top:8px}
.ask{width:100%}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));transform:translate(-50%,20px);background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;overflow:auto}
#player.show{display:flex}
.pl-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.pl-top .x{background:var(--card2);flex:none;width:36px;height:36px;font-size:18px;color:var(--mut)}
.pl-top>span{font-size:12px;color:var(--mut);font-weight:700;flex:none}
.pl-prog{flex:1;display:flex;gap:3px}.pl-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.pl-prog i.d{background:var(--ac)}.pl-prog i.c{background:var(--ac2)}
.pl-body{padding:4px 16px calc(24px + var(--sb));max-width:560px;width:100%;margin:0 auto;text-align:center}
.pl-fig{background:#101520;border-radius:18px;overflow:hidden;aspect-ratio:4/3;width:100%;margin:6px 0 12px}
.pl-fig svg{width:100%;height:100%}
.pl-body h2{font-size:24px;letter-spacing:-.02em}
.pl-set{margin-top:12px;display:flex;justify-content:center;gap:10px;align-items:baseline}.pl-set b{font-size:17px;color:var(--ac2)}.pl-set span{color:var(--mut);font-size:13px}
.ctls{display:flex;gap:10px;margin-top:10px}
.ctl{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px}
.ctl button{width:48px;height:56px;font-size:26px;font-weight:700;color:var(--ac2);flex:none}
.ctl>div{flex:1;text-align:center}.ctl b{display:block;font-size:26px;line-height:1.1}.ctl span{font-size:11px;color:var(--mut)}
.ctl.slim{margin-top:8px}.ctl.slim button{font-size:18px;height:46px}
.row.sm{justify-content:center;margin-top:6px}
.ring{position:relative;width:170px;height:170px;margin:14px auto}
.ring.sm{width:130px;height:130px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:var(--card2)}.ring .fg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:800}
.ring small{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:var(--mut);font-size:11px}
.ring.sm span{font-size:38px}
.restwrap{padding:20px 16px;text-align:center;max-width:560px;width:100%;margin:0 auto}
.up-next{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:14px 0}
.up-next .th{width:110px;height:82px;flex:none;border-radius:10px;background:#101520;overflow:hidden}
.up-next span{display:block;font-size:12px;color:var(--mut)}.up-next b{display:block;font-size:17px}
.sum{padding:24px 16px calc(30px + var(--sb));max-width:560px;margin:0 auto;width:100%;text-align:center}
.sum .ok{width:64px;height:64px;border-radius:50%;background:rgba(74,222,128,.15);color:var(--ok);display:grid;place-items:center;font-size:32px;margin:10px auto}
.sum h1{font-size:26px}.sum .card{text-align:left}
</style></head><body>
<div id="app"><header class="top"><b>Ground<i>work</i></b><span>Strength</span></header><main id="view"></main></div>
<nav>
<button data-act="tab" data-t="today"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Today</button>
<button data-act="tab" data-t="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
<button data-act="tab" data-t="progress"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>Progress</button>
<button data-act="tab" data-t="gear"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Gear</button>
</nav>
<div id="player"></div>
<div id="sheet"><div class="panel"></div></div>
<div id="toast"></div>
<script>/* ================= FIGURE ENGINE (DOM-free) ================= */
const FL=160;
const SZ={tor:42,th:29,sh:28,ft:12,ua:23,fa:21,hd:4,nk:15,hr:8};
const C={near:'#8493b0',far:'#4d5972',torso:'#97a5c2',head:'#a9b6d0',hand:'#b9c4da',shoe:'#2a3042',
  glowP:'#ff6a2b',glowS:'#ffb54a'};
const D=a=>{const r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)]};
const pt=(p,a,l)=>{const d=D(a);return [p[0]+d[0]*l,p[1]+d[1]*l]};
const f1=n=>(Math.round(n*10)/10);
function ik(P,T,l1,l2,sg){
  const dx=T[0]-P[0],dy=T[1]-P[1];let d=Math.hypot(dx,dy)||.01;
  const dm=Math.max(Math.abs(l1-l2)+.1,Math.min(d,l1+l2-.05));
  const a=(l1*l1-l2*l2+dm*dm)/(2*dm),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const ux=dx/d,uy=dy/d;
  return [P[0]+ux*a-uy*h*sg,P[1]+uy*a+ux*h*sg];
}
function lerpPose(a,b,t){
  const o={};
  for(const k in a){const va=a[k],vb=(k in b)?b[k]:va;
    o[k]=Array.isArray(va)?va.map((x,i)=>x+(vb[i]-x)*t):(typeof va==='number'?va+(vb-va)*t:va);}
  for(const k in b) if(!(k in o)) o[k]=b[k];
  return o;
}
/* ---- limb solving ---- */
function armSolve(S,g,mir,cx){
  const m=mir?-1:1;let E,W,Hd;
  if(g.hand){let h=g.hand;if(mir)h=[2*cx-h[0],h[1]];E=ik(S,h,SZ.ua,SZ.fa,(g.eb??1)*m);W=h;Hd=h;}
  else{E=pt(S,(g.ua??0)*m,SZ.ua);W=pt(E,(g.fa??0)*m,SZ.fa);Hd=pt(W,(g.fa??0)*m,SZ.hd);}
  return {S,E,W,Hd};
}
function legSolve(H,g,mir,cx){
  const m=mir?-1:1;let K,A;
  if(g.ank){let a=g.ank;if(mir)a=[2*cx-a[0],a[1]];K=ik(H,a,SZ.th,SZ.sh,(g.kb??-1)*m);A=a;}
  else{K=pt(H,(g.th??0)*m,SZ.th);A=pt(K,(g.sh??0)*m,SZ.sh);}
  const ft=g.ft??90;
  return {H,K,A,T:pt(A,ft*m,SZ.ft),Hl:pt(A,ft*m,-3.5)};
}
const pick=(P,pre,keys)=>{const g={};for(const k of keys){const v=P[pre+k]!==undefined?P[pre+k]:P[k];if(v!==undefined)g[k]=v;}return g;};
function offs(p,dx,dy){return p?[p[0]+dx,p[1]+dy]:p}
function solve(P,view){
  const H=[P.hx,P.hy],tor=P.tor??180,S=pt(H,tor,SZ.tor),nk=P.neck??tor;
  const hd=pt(S,nk,SZ.nk);
  const R={H,S,hd,tor,nk,view};
  if(view==='side'){
    const ag=pick(P,'',['ua','fa','hand','eb']),lg=pick(P,'',['th','sh','ank','kb','ft']);
    const fag=pick(P,'f',['ua','fa','hand','eb']),flg=pick(P,'f',['th','sh','ank','kb','ft']);
    if(!P.fhand&&ag.hand)fag.hand=offs(ag.hand,-6,0);
    if(!P.fank&&lg.ank)flg.ank=offs(lg.ank,-7,0);
    R.n={arm:armSolve(S,ag,false),leg:legSolve(H,lg,false)};
    const Sf=offs(S,-2.5,-.5),Hf=offs(H,-2.5,-.5);
    R.f={arm:armSolve(Sf,fag,false),leg:legSolve(Hf,flg,false)};
  }else{
    const cx=S[0],w=17;

const stepW=(w,d)=>{const i=LAD.indexOf(snap(w));return LAD[Math.max(0,Math.min(LAD.length-1,i+d))];};

/* ---------- state ---------- */
const KEY='groundwork_v2';
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const DEF=()=>({gear:{dumbbell:1,bench:1,tower:1,band:1,ball:1},cycle:0,lastMins:20,tracks:{push:0,pull:0,dip:0,squat:0,core:0},
  weights:{},reps:{},hold:{},logs:[],plan:null,tab:'today'});
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const d=DEF();return Object.assign(d,r,{gear:Object.assign(d.gear,r.gear||{}),tracks:Object.assign(d.tracks,r.tracks||{})});}}catch(e){}return DEF();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function ensurePlan(){
  const t=todayKey();
  if(!S.plan||S.plan.date!==t){S.plan={date:t,focus:null,swaps:{},sessions:[{m:S.lastMins||20,f:null,done:false}],open:0};save();}
}
const activeFocus=()=>S.plan.focus||ROT[S.cycle%ROT.length];
/* ---------- planner ---------- */
const avail=ex=>ex.eq.every(e=>S.gear[e]);
const mid=a=>(a[0]+a[1])/2;
const workSec=ex=>ex.kind==='t'?mid(ex.rng):mid(ex.rng)*3.4*(ex.per?2:1);
const exSec=(ex,sets,rest)=>12+sets*workSec(ex)+Math.max(0,sets-1)*rest+8;
const restFor=(m,F)=>F&&F.rest?F.rest:(m<=15?40:m<=30?50:m<=45?60:75);
function trackOf(id){for(const k in TRACKS){const i=TRACKS[k].steps.indexOf(id);if(i>=0)return {k,i};}return null;}
function resolveTrack(k,used){
  const T=TRACKS[k],lv=Math.min(S.tracks[k],T.steps.length-1);
  const order=[lv];for(let i=lv-1;i>=0;i--)order.push(i);for(let i=lv+1;i<T.steps.length;i++)order.push(i);
  for(const i of order){const e=EX[T.steps[i]];if(e&&avail(e)&&!used.has(e.id))return e;}
  return null;
}
function resolveSlot(slot,used){
  let e=null;
  if(typeof slot==='string'&&slot.startsWith('trk:'))e=resolveTrack(slot.slice(4),used);
  else for(const id of slot){const c=EX[id];if(c&&avail(c)&&!used.has(c.id)){e=c;break;}}
  if(e){const sw=S.plan.swaps[e.id];if(sw&&EX[sw]&&avail(EX[sw])&&!used.has(sw))e=EX[sw];}
  return e;
}
function curW(ex){return ex.w0?snap(S.weights[ex.id]??ex.w0):null;}
function planSession(fid,mins,ctx){
  const F=FOCUS[fid],rest=restFor(mins,F),budget=mins*60,seen=new Set(ctx.used);
  const warm=[],cool=[];
  if(ctx.first&&F.warm){const n=mins<=25?1:2;for(const id of F.warm){const e=EX[id];if(e&&avail(e)&&warm.length<n&&!seen.has(id)){warm.push({ex:e,sets:1,rest:0});seen.add(id);}}}
  if(ctx.last&&F.cool&&mins>=20){const n=mins>=40?2:1;for(const id of F.cool){const e=EX[id];if(e&&avail(e)&&cool.length<n&&!seen.has(id)){cool.push({ex:e,sets:1,rest:0});seen.add(id);}}}
  let tot=0;for(const w of warm.concat(cool))tot+=exSec(w.ex,1,0);
  const cands=[];for(const slot of F.slots){const e=resolveSlot(slot,seen);if(e){cands.push(e);seen.add(e.id);}}
  const main=[],base=F.baseSets||2,cap=Math.min(F.maxSets||9,mins>=45?4:3);
  for(const c of cands){const s=exSec(c,base,rest);if(tot+s<=budget||main.length===0){main.push({ex:c,sets:base,rest});tot+=s;}else break;}
  let again=true;
  while(again){again=false;for(const m of main){if(m.sets<cap){const add=workSec(m.ex)+rest;if(tot+add<=budget){m.sets++;tot+=add;again=true;}}}}
  const items=[...warm,...main,...cool].map(it=>({id:it.ex.id,sets:it.sets,rest:it.rest}));
  return {focus:fid,m:mins,est:tot,items};
}
function buildDay(){
  const fid=activeFocus(),used=new Set(),out=[];
  const pend=[];S.plan.sessions.forEach((s,i)=>{if(!s.done&&s.f!=='primer')pend.push(i);});
  const lastPend=pend[pend.length-1];let mainSeen=false;
  S.plan.sessions.forEach((s,i)=>{
    if(s.done){(s.ids||[]).forEach(id=>used.add(id));if(s.f!=='primer')mainSeen=true;out.push({done:true});return;}
    if(s.f==='primer'){out.push(planSession('primer',s.m,{used:new Set(),first:false,last:false}));return;}
    const primerBefore=S.plan.sessions.slice(0,i).some(x=>x.f==='primer');
    const p=planSession(s.f||fid,s.m,{used,first:!mainSeen&&!primerBefore,last:i===lastPend});
    p.items.forEach(it=>used.add(it.id));mainSeen=true;out.push(p);
  });
  return out;
}
function alts(ex){
  const inPlan=new Set(buildDay().flatMap(p=>p.items?p.items.map(i=>i.id):[]));
  return Object.values(EX).filter(e=>e.id!==ex.id&&!e.warm&&!e.cool&&avail(e)&&!inPlan.has(e.id)&&e.m.p.some(g=>ex.m.p.includes(g)));
}
function muscleUnion(items){
  const p=new Set(),s=new Set();
  items.forEach(i=>{const e=EX[i.id];if(e.warm||e.cool)return;e.m.p.forEach(g=>p.add(g));});
  items.forEach(i=>{const e=EX[i.id];if(e.warm||e.cool)return;e.m.s.forEach(g=>{if(!p.has(g))s.add(g);});});
  return {p:[...p],s:[...s]};
}
function targetText(ex,sets){
  const r=ex.kind==='t'?`${ex.rng[0]} to ${ex.rng[1]} sec`:`${ex.rng[0]} to ${ex.rng[1]} reps`;
  return `${sets} x ${r}${ex.per?' each side':''}`;
}
const fmtMin=s=>Math.max(1,Math.round(s/60));
function heat(days=7){
  const cut=Date.now()-days*864e5,h={};
  S.logs.filter(l=>l.ts>=cut).forEach(l=>l.ex.forEach(x=>{const e=EX[x.id];if(!e)return;const n=x.sets.length;
    e.m.p.forEach(g=>h[g]=(h[g]||0)+n);e.m.s.forEach(g=>h[g]=(h[g]||0)+n*.4);}));
  const out={};for(const g in h)out[g]=Math.min(1,h[g]/9);return {map:out,raw:h};
}
function streak(){
  const days=new Set(S.logs.map(l=>l.date));let n=0;const d=new Date();
  const k=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(!days.has(k(d)))d.setDate(d.getDate()-1);
  while(days.has(k(d))){n++;d.setDate(d.getDate()-1);}return n;
}

}
function viewGear(){
  let h=`<section class="card"><div class="sec-h">Your equipment<span>turn off what you do not use</span></div>`;
  GEAR.forEach(g=>{h+=`<div class="gear"><div><b>${g.name}</b><span>${g.sub}</span></div><button class="tog ${S.gear[g.id]?'on':''}" data-act="gear" data-id="${g.id}" aria-label="toggle ${g.name}"><i></i></button></div>`;});
  h+=`<p class="hint">Bodyweight, wall and floor moves are always on. Treadmill and elliptical are left out on purpose, this app is strength only.</p></section>`;
  const loaded=Object.values(EX).filter(e=>e.w0&&avail(e));
  h+=`<section class="card"><div class="sec-h">Starting weights<span>per dumbbell</span></div><p class="hint" style="margin-top:0">These are cautious beginner starts. Change them to match what feels challenging but clean. The app raises them for you when you earn it.</p>`;
  loaded.forEach(e=>{h+=`<div class="gear"><div><b>${e.name}</b><span>${e.one?'one dumbbell':'each hand'}</span></div><div class="step"><button data-act="wt" data-id="${e.id}" data-d="-1">-</button><b>${curW(e)} lb</b><button data-act="wt" data-id="${e.id}" data-d="1">+</button></div></div>`;});
  h+=`</section><section class="card"><div class="sec-h">Your data</div><p class="hint" style="margin-top:0">Everything is saved on this phone only.</p><div class="row"><button class="ghost" data-act="export">Copy backup</button><button class="ghost danger" data-act="reset">Reset everything</button></div></section>`;
  return h;
}
function render(){
  const v=S.tab;const root=$('#view');
  root.innerHTML=v==='today'?viewToday():v==='plan'?viewPlan():v==='progress'?viewProgress():viewGear();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===v));
  hook();
}
/* ---------- sheets ---------- */
function openSheet(html){const s=$('#sheet');s.querySelector('.panel').innerHTML=html+'<div style="height:14px"></div>';s.classList.add('show');s.querySelector('.panel').scrollTop=0;hook();}
function closeSheet(){$('#sheet').classList.remove('show');}
function ask(title,msg,btns){
  openSheet(`<h2>${title}</h2><p class="hint" style="margin-top:6px">${msg}</p><div class="col">${btns.map((b,i)=>`<button class="${b.cls||'ghost'} ask" data-ask="${i}">${b.t}</button>`).join('')}</div>`);
  window._ask=btns;
}
function detailSheet(id){
  const e=EX[id],tr=trackOf(id),w=curW(e);
  let h=`<div class="bigfig">${figEl(id,'big')}</div><h2>${e.name}</h2>
   <div class="chips" style="margin:6px 0 10px">${e.m.p.map(g=>chip(g,'p')).join('')}${e.m.s.map(g=>chip(g,'s')).join('')}</div>
   <div class="mmwrap">${mmEl(e.m.p,e.m.s,{labels:1})}</div>
   <div class="sec-h" style="margin-top:14px">How to do it</div><ol class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ol>
   <div class="facts"><div><b>${e.kind==='t'?e.rng[0]+' to '+e.rng[1]+' sec':e.rng[0]+' to '+e.rng[1]+' reps'}${e.per?' each side':''}</b><span>Target</span></div>${w?`<div><b>${w} lb</b><span>${e.one?'One dumbbell':'Each hand'}</span></div>`:''}</div>`;
  if(e.knee)h+=`<p class="note">Keep the range shallow and comfortable. Stop if a joint complains.</p>`;
  if(tr){const T=TRACKS[tr.k];h+=`<p class="note">Step ${tr.i+1} of ${T.steps.length} on the ${T.name}. ${tr.i<T.steps.length-1?'Move up when you can do '+T.up[tr.i]+'.':'This is the top step.'}</p>`;}
  if(!e.warm&&!e.cool)h+=`<div class="row" style="margin-top:12px"><button class="ghost" data-act="swap" data-id="${id}">Swap this exercise</button><button class="primary" data-act="closesheet">Got it</button></div>`;
  else h+=`<div class="row" style="margin-top:12px"><button class="primary" data-act="closesheet">Got it</button></div>`;
  openSheet(h);
}
function swapSheet(id){
  const e=EX[id],list=alts(e);
  let h=`<h2>Swap ${e.name}</h2><p class="hint" style="margin-top:4px">Same muscles, using your available gear.</p>`;
  if(!list.length)h+=`<p class="hint">No other options right now. Try turning on more equipment in Gear.</p>`;
  list.forEach(a=>{h+=`<div class="ex alt" data-act="doswap" data-from="${id}" data-to="${a.id}"><div class="th">${figEl(a.id)}</div><div class="tx"><b>${a.name}</b><span>${targetText(a,2)}</span><div class="chips">${a.m.p.map(g=>chip(g,'p')).join('')}</div></div></div>`;});
  openSheet(h);
}
function focusSheet(){
  const cur=activeFocus();
  let h=`<h2>Choose today's focus</h2><p class="hint" style="margin-top:4px">Different muscles each day keeps you fresh and progressing.</p>`;
  [...ROT,'primer'].forEach(k=>{const F=FOCUS[k];h+=`<div class="rot ${k===cur?'next':''}" data-act="setfocus" data-k="${k}"><div class="rt"><b>${F.name}</b><span>${F.sub}</span></div><div class="rm">${mmEl(F.muscles,[])}</div></div>`;});
  openSheet(h);
}
/* ---------- figure animation ---------- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const vis=new Set();
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target))):null;
function hook(){document.querySelectorAll('svg.fig').forEach(n=>{if(!n._h){n._h=1;io?io.observe(n):vis.add(n);}});}
let lastT=0;
function loop(ts){requestAnimationFrame(loop);if(ts-lastT<34)return;lastT=ts;
  vis.forEach(n=>{if(!n.isConnected){vis.delete(n);return;}
    const ex=EX[n.dataset.ex];if(!ex)return;const per=ex.slow?6:ex.hold?4.4:3.6;
    const ph=((ts/1000/per)+(+n.dataset.ph))%1;n.innerHTML=sceneInner(ex,reduce?.5:phaseT(ex,ph));});}

/* ================= APP: player + actions ================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
let wake=null;
async function lockWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen');}catch(e){}}
function unlockWake(){try{wake&&wake.release();}catch(e){}wake=null;}
let actx=null;
function beep(n=1){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime+i*.22;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17);}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(n>1?[120,80,120]:150);}catch(e){}}
/* ---------- session set ---------- */
function setSessions(list){
  ensurePlan();
  const keep=S.plan.sessions.filter(s=>s.done);
  S.plan.sessions=keep.concat(list.map(m=>({m:m.m,f:m.f||null,done:false})));
  S.plan.open=null;S.lastMins=list[list.length-1].m;save();
}
function parsePreset(v){return v.split(',').map(x=>x.startsWith('p')?{m:+x.slice(1),f:'primer'}:{m:+x});}
/* ---------- player ---------- */
let P=null,tick=null;
const curItem=()=>P.items[P.i];
function initCur(){
  const it=curItem(),e=EX[it.id];P.w=curW(e);
  P.r=e.kind==='t'?clamp(S.hold[e.id]||e.rng[0],e.rng[0],e.rng[1]):clamp(S.reps[e.id]||Math.round(mid(e.rng)),1,60);
}
function startSession(i){
  const p=buildDay()[i];if(!p||p.done)return;
  P={idx:i,focus:S.plan.sessions[i].f||activeFocus(),items:p.items.map(it=>({id:it.id,sets:it.sets,rest:it.rest,log:[]})),i:0,set:0,phase:'work',t0:Date.now(),holdOn:false};
  initCur();$('#player').classList.add('show');document.body.classList.add('lock');lockWake();renderPlayer();
}
function stopTick(){if(tick){clearInterval(tick);tick=null;}}
function plTop(){
  const n=P.items.length;
  return `<div class="pl-top"><button class="x" data-act="plx" aria-label="close">x</button><div class="pl-prog">${P.items.map((_,k)=>`<i class="${k<P.i?'d':k===P.i?'c':''}"></i>`).join('')}</div><span>${Math.min(P.i+1,n)}/${n}</span></div>`;
}
function renderPlayer(){
  const el=$('#player');stopTick();
  if(P.phase==='done'){el.innerHTML=summaryHTML();hook();return;}
  const it=curItem(),e=EX[it.id];
  if(P.phase==='rest'){
    const nextSame=P.set>0,ne=EX[curItem().id];
    el.innerHTML=plTop()+`<div class="restwrap"><div class="eyebrow">Rest</div>
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="bg"/><circle cx="60" cy="60" r="52" class="fg" id="rg"/></svg><span id="tm">${P.restTotal}</span></div>
      <div class="up-next"><div class="th">${figEl(ne.id)}</div><div><span>Up next</span><b>${ne.name}</b><span>${nextSame?`Set ${P.set+1} of ${it.sets}`:'New exercise'}</span></div></div>
      <div class="row"><button class="ghost" data-act="restplus">+15 s</button><button class="primary" data-act="skiprest">Skip rest</button></div></div>`;
    hook();runRest();return;
  }
  const w=e.w0?`<div class="ctl"><button data-act="wd" data-d="-1">-</button><div><b>${P.w}</b><span>lb ${e.one?'(one dumbbell)':'each hand'}</span></div><button data-act="wd" data-d="1">+</button></div>`:'';
  const r=e.kind==='t'?'':`<div class="ctl"><button data-act="rd" data-d="-1">-</button><div><b>${P.r}</b><span>reps${e.per?' each side':''}</span></div><button data-act="rd" data-d="1">+</button></div>`;
  let body;
  if(e.kind==='t'){
    body=`<div class="ring sm"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="bg"/><circle cx="60" cy="60" r="52" class="fg" id="rg"/></svg><span id="tm">${P.r}</span><small>sec</small></div>
     <div class="ctl slim"><button data-act="rd" data-d="-5">-5</button><div><b>${P.r}</b><span>target seconds</span></div><button data-act="rd" data-d="5">+5</button></div>
     <button class="btn big" data-act="hold">${P.holdOn?'Stop':'Start timer'}</button>`;
  }else body=`<div class="ctls">${w}${r}</div><button class="btn big" data-act="done">Done set ${P.set+1}</button>`;
  el.innerHTML=plTop()+`<div class="pl-body"><div class="pl-fig">${figEl(e.id,'big')}</div>
    <h2>${e.name}</h2><div class="chips c">${e.m.p.map(g=>chip(g,'p')).join('')}${e.m.s.map(g=>chip(g,'s')).join('')}</div>
    <div class="pl-set"><b>Set ${P.set+1} of ${it.sets}</b><span>${e.kind==='t'?e.rng[0]+' to '+e.rng[1]+' sec':e.rng[0]+' to '+e.rng[1]+' reps'}${e.per?' each side':''}</span></div>
    <ul class="cues short">${e.cues.slice(0,3).map(c=>`<li>${c}</li>`).join('')}</ul>${body}
    <div class="row sm"><button class="link" data-act="skipex">Skip exercise</button>${e.warm||e.cool?'':'<button class="link" data-act="pswapsheet">Swap</button>'}</div></div>`;
  hook();
  if(e.kind==='t'&&P.holdOn)runHold();
}
function setRing(frac){const c=$('#rg');if(c){const L=326.7;c.style.strokeDasharray=L;c.style.strokeDashoffset=L*(1-clamp(frac,0,1));}}
function runRest(){
  const upd=()=>{const rem=Math.ceil((P.restEnd-Date.now())/1000);const tm=$('#tm');
    if(rem<=0){stopTick();beep(2);endRest();return;}
    if(tm)tm.textContent=rem;setRing(rem/P.restTotal);};
  upd();tick=setInterval(upd,250);
}
function endRest(){P.phase='work';renderPlayer();}
function startRest(sec){
  if(!sec){P.phase='work';renderPlayer();return;}
  P.phase='rest';P.restTotal=sec;P.restEnd=Date.now()+sec*1000;renderPlayer();
}
function runHold(){
  const total=P.r;P.holdStart=P.holdStart||Date.now();
  const upd=()=>{const el=(Date.now()-P.holdStart)/1000,rem=Math.ceil(total-el);const tm=$('#tm');
    if(tm)tm.textContent=Math.max(0,rem);setRing(1-el/total);
    if(el>=total){stopTick();beep(2);finishHold(total);}};
  upd();tick=setInterval(upd,200);
}
function finishHold(secs){stopTick();P.holdOn=false;P.holdStart=null;logSet(0,Math.round(secs));}
function logSet(r,secs){
  const it=curItem(),e=EX[it.id];
  it.log.push({r:r,w:e.w0?P.w:0,t:secs||0});
  if(e.kind!=='t')S.reps[e.id]=r;
  if(P.set+1<it.sets){P.set++;startRest(it.rest);}
  else{P.i++;P.set=0;if(P.i>=P.items.length){P.phase='done';renderPlayer();return;}
    const prevRest=it.rest;initCur();startRest(prevRest?Math.max(prevRest,20):0);}
}
function summaryData(){
  const mins=Math.max(1,Math.round((Date.now()-P.t0)/60000));
  const logged=P.items.filter(it=>it.log.length);
  const bumps=[],ups=[];
  logged.forEach(it=>{
    const e=EX[it.id],full=it.log.length>=it.sets;
    const top=e.kind==='t'?it.log.every(l=>l.t>=e.rng[1]):it.log.every(l=>l.r>=e.rng[1]);
    if(e.w0){const w=it.log[it.log.length-1].w;
      if(full&&top&&stepW(w,1)!==w)bumps.push({id:it.id,from:w,to:stepW(w,1)});}
    const tr=trackOf(it.id);
    if(tr&&tr.i===S.tracks[tr.k]&&tr.i<TRACKS[tr.k].steps.length-1&&full&&top)ups.push({k:tr.k,to:EX[TRACKS[tr.k].steps[tr.i+1]].name});
  });
  const sets=logged.reduce((a,it)=>a+it.log.length,0);
  return {mins,logged,bumps,ups,sets,mu:muscleUnion(logged.map(it=>({id:it.id})))};
}
function summaryHTML(){
  const d=summaryData();P.sum=d;
  const none=!d.logged.length;
  let h=`<div class="sum"><div class="ok">&#10003;</div><h1>${none?'Nothing logged':'Session complete'}</h1><p class="hint">${none?'You skipped everything this time. That is fine, come back when you can.':'Every session counts. Here is what you did.'}</p>
   <div class="stats"><div><b>${d.mins}</b><span>Minutes</span></div><div><b>${d.logged.length}</b><span>Moves</span></div><div><b>${d.sets}</b><span>Sets</span></div></div>`;
  if(!none)h+=`<div class="card"><div class="sec-h">Muscles worked</div>${mmEl(d.mu.p,d.mu.s,{labels:1})}</div>`;
  if(d.bumps.length)h+=`<div class="card"><div class="sec-h">Level up next time</div>${d.bumps.map(b=>`<div class="pb"><span>${EX[b.id].name}</span><b>${b.from} to ${b.to} lb</b></div>`).join('')}</div>`;
  if(d.ups.length)h+=`<div class="card"><div class="sec-h">Ready for a harder step?</div>${d.ups.map(u=>`<div class="pb"><span>${TRACKS[u.k].name}: <b>${u.to}</b></span><button class="mini" data-act="plup" data-k="${u.k}">Move up</button></div>`).join('')}</div>`;
  h+=`<button class="btn big" data-act="plsave">${none?'Close':'Save and finish'}</button></div>`;
  return h;
}
function saveSession(){
  const d=P.sum||summaryData(),fid=P.focus;
  if(d.logged.length){
    // persist progress
    d.logged.forEach(it=>{const e=EX[it.id];
      if(e.w0){S.weights[e.id]=it.log[it.log.length-1].w;}
      if(e.kind==='t'){const best=Math.max(...it.log.map(l=>l.t));S.hold[e.id]=clamp(best>=e.rng[1]?e.rng[1]:best+(it.log.every(l=>l.t>=P.r)?5:0),e.rng[0],e.rng[1]);}
    });
    d.bumps.forEach(b=>{S.weights[b.id]=b.to;S.reps[b.id]=EX[b.id].rng[0];});
    const t=Date.now();
    S.logs.push({ts:t,date:todayKey(),focus:fid,mins:d.mins,ex:d.logged.map(it=>({id:it.id,sets:it.log}))});
    const s=S.plan.sessions[P.idx];s.done=true;s.ids=d.logged.map(it=>it.id);s.m=d.mins;
    const pendMain=S.plan.sessions.some(x=>!x.done&&x.f!=='primer');
    if(!pendMain&&ROT.includes(fid))S.cycle=(ROT.indexOf(fid)+1)%ROT.length;
    S.plan.open=null;
  }
  save();
}
function closePlayer(){stopTick();unlockWake();$('#player').classList.remove('show');document.body.classList.remove('lock');P=null;render();}
/* ---------- actions ---------- */
const ACT={
 tab(t){S.tab=t.dataset.t;save();render();window.scrollTo(0,0);},
 focus(){focusSheet();},
 setfocus(t){S.plan.focus=t.dataset.k;S.plan.swaps={};S.plan.open=null;save();closeSheet();S.tab='today';render();},
 pickfocus(t){ACT.setfocus(t);},
 preset(t){setSessions(parsePreset(t.dataset.v));S.tab='today';render();window.scrollTo(0,0);},
 mm(t){const s=S.plan.sessions[+t.dataset.i];s.m=clamp(s.m+(+t.dataset.d),10,60);S.lastMins=s.m;S.plan.open=+t.dataset.i;save();render();},
 sf(t){const s=S.plan.sessions[+t.dataset.i];s.f=s.f==='primer'?null:'primer';save();render();},
 rm(t){if(S.plan.sessions.length>1){S.plan.sessions.splice(+t.dataset.i,1);S.plan.open=null;save();render();}},
 add(){S.plan.sessions.push({m:15,f:null,done:false});save();render();},
 open(t){const i=+t.dataset.i;S.plan.open=S.plan.open===i?-1:i;render();},
 detail(t){detailSheet(t.dataset.id);},
 swap(t){swapSheet(t.dataset.id);},
 doswap(t){const from=t.dataset.from,to=t.dataset.to,sw=S.plan.swaps;let key=Object.keys(sw).find(k=>sw[k]===from)||from;sw[key]=to;save();closeSheet();render();toast('Swapped');},
 closesheet(){closeSheet();},
 start(t){closeSheet();startSession(+t.dataset.i);},
 lvl(t){const k=t.dataset.k,T=TRACKS[k];S.tracks[k]=clamp(S.tracks[k]+(+t.dataset.d),0,T.steps.length-1);save();render();toast(EX[T.steps[S.tracks[k]]].name);},
 gear(t){S.gear[t.dataset.id]=S.gear[t.dataset.id]?0:1;S.plan.swaps={};save();render();},
 wt(t){const e=EX[t.dataset.id];S.weights[e.id]=stepW(curW(e),+t.dataset.d);save();render();},
 export(){const j=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(j).then(()=>toast('Backup copied'),()=>window.prompt('Copy your backup',j));else window.prompt('Copy your backup',j);},
 reset(){ask('Reset everything?','This clears your history, weights and skill levels on this phone.',[{t:'Yes, reset',cls:'danger',fn(){try{localStorage.removeItem(KEY);}catch(e){}S=DEF();ensurePlan();closeSheet();render();}},{t:'Keep my data',fn(){closeSheet();}}]);},
 /* player */
 wd(t){P.w=stepW(P.w,+t.dataset.d);renderPlayer();},
 rd(t){const e=EX[curItem().id];P.r=clamp(P.r+(+t.dataset.d),1,e.kind==='t'?300:99);renderPlayer();},
 done(){logSet(P.r);},
 hold(){if(P.holdOn){const secs=(Date.now()-P.holdStart)/1000;finishHold(secs);}else{P.holdOn=true;P.holdStart=Date.now();renderPlayer();}},
 skiprest(){stopTick();endRest();},
 restplus(){P.restEnd+=15000;P.restTotal+=15;runRest();},
 skipex(){const it=curItem();P.i++;P.set=0;P.holdOn=false;if(P.i>=P.items.length){P.phase='done';renderPlayer();return;}initCur();P.phase='work';renderPlayer();},
 pswapsheet(){const e=EX[curItem().id],list=alts(e);
   let h=`<h2>Swap ${e.name}</h2>`;if(!list.length)h+='<p class="hint">No other options with your gear.</p>';
   list.forEach(a=>{h+=`<div class="ex alt" data-act="pdoswap" data-to="${a.id}"><div class="th">${figEl(a.id)}</div><div class="tx"><b>${a.name}</b><span>${targetText(a,curItem().sets)}</span></div></div>`;});openSheet(h);},
 pdoswap(t){curItem().id=t.dataset.to;initCur();closeSheet();renderPlayer();},
 plx(){const any=P.items.some(it=>it.log.length);
   ask('End this workout?',any?'Your logged sets can be saved.':'Nothing has been logged yet.',[
    {t:'Keep going',cls:'primary',fn(){closeSheet();}},
    ...(any?[{t:'Save and finish',fn(){closeSheet();P.phase='done';renderPlayer();}}]:[]),
    {t:'Discard',cls:'danger',fn(){closeSheet();closePlayer();}}]);},
 plup(t){const k=t.dataset.k;S.tracks[k]=clamp(S.tracks[k]+1,0,TRACKS[k].steps.length-1);save();t.textContent='Done';t.disabled=true;toast('Level up!');},
 plsave(){saveSession();closePlayer();toast('Saved');}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-ask]');if(a){const b=window._ask[+a.dataset.ask];if(b)b.fn();return;}
  const t=e.target.closest('[data-act]');
  if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t);return;}
  if(e.target.id==='sheet')closeSheet();
});
/* ---------- init ---------- */
ensurePlan();render();requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ensurePlan();if(!P)render();else if(P&&!wake)lockWake();}});

</script></body></html>
