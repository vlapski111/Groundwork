<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1118"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Groundwork">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Groundwork Strength</title>
<style>:root{--bg:#0d1118;--bg2:#121824;--card:#171e2b;--card2:#1f2838;--line:#27324a;--text:#eef1f6;--mut:#8f9ab2;--dim:#5e6b87;--ac:#ff6a2b;--ac2:#ffb54a;--teal:#2fd3be;--ok:#4ade80;--bad:#ff5d5d;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4}
h1,h2,p,ol,ul{margin:0}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(150px + var(--sb))}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 2px 6px}
header.top b{font-size:21px;font-weight:800;letter-spacing:-.02em}header.top b i{font-style:normal;color:var(--ac)}
header.top span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px;margin-bottom:10px;letter-spacing:-.01em}
.sec-h span{font-weight:500;font-size:12px;color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* hero */
.hero{display:flex;gap:10px;align-items:center;background:linear-gradient(160deg,#1b2436,#141b29);overflow:hidden}
.hero-l{flex:1;min-width:0}.hero-l h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0}.hero-l p{color:var(--mut);font-size:14px}
.hero .row{margin-top:12px}.hero-r{width:128px;flex:none}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600}
.streak{font-size:12px;color:var(--ac2);font-weight:700}
.mm svg{width:100%;height:auto;display:block}
.mm .mmlab,.mmbig .mmlab,.mmwrap .mmlab{fill:#5e6b87;font:700 8px sans-serif;letter-spacing:.14em}
.mmbig{max-width:340px;margin:0 auto}.mmwrap{max-width:300px;margin:0 auto}
.hl.p{filter:drop-shadow(0 0 3px rgba(255,106,43,.75));animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px;font-size:11px;color:var(--mut)}
.legend i{width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,#323c54,rgba(255,106,43,.35),#ff6a2b)}
/* time */
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.presets button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;min-width:50px}
.presets button.wide{flex:1;min-width:130px;color:var(--ac2)}
.presets button:active{background:var(--ac);color:#1a0a02}
.srow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.srow .slab{flex:1;min-width:0}.slab b{display:block;font-size:15px}.slab span{font-size:12px;color:var(--mut)}
.srow.done{opacity:.55}.sdone{color:var(--ok);font-size:13px;font-weight:700}
.step{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.step button{width:40px;height:40px;font-size:22px;font-weight:700;color:var(--ac2)}
.step b{min-width:62px;text-align:center;font-size:15px}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;color:var(--mut)}
.x{width:32px;height:32px;border-radius:50%;color:var(--dim);font-size:15px}
.addline{width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--mut);font-weight:600;margin-top:4px}
/* sessions */
.sess{padding:0;overflow:hidden}
.sess header{display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer}
.sess header b{font-size:16px}.sess header span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.chev{width:10px;height:10px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:.2s;margin-right:6px}
.sess.open .chev{transform:rotate(-135deg)}
.sess .list{display:none;padding:0 10px 10px}.sess.open .list{display:block}
.ex{display:flex;gap:10px;align-items:center;padding:8px;margin-top:6px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.ex .th{width:104px;height:78px;flex:none;border-radius:10px;background:#101520;overflow:hidden}
.th svg{width:100%;height:100%;display:block}
.ex .tx{flex:1;min-width:0}.ex .tx b{display:block;font-size:15px;line-height:1.2}.ex .tx b em{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-left:4px;font-weight:700}
.ex .tx>span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}.ex .tx .w{color:var(--ac2);font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.chips.c{justify-content:center}
.chip{font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--mut);font-weight:700}
.chip.p{background:rgba(255,106,43,.16);color:#ff8a57}.chip.s{background:rgba(255,181,74,.13);color:var(--ac2)}
.swap{width:36px;height:36px;border-radius:50%;background:var(--card2);color:var(--mut);font-size:17px;flex:none}
.donecard h2{font-size:20px;color:var(--ok)}.donecard p{color:var(--mut);margin-top:6px;font-size:14px}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--sb));width:min(530px,calc(100% - 28px));height:56px;border-radius:16px;background:var(--ac);color:#1a0a02;font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(255,106,43,.35);z-index:30}
/* buttons */
.btn{display:block;width:100%;border-radius:16px;background:var(--ac);color:#1a0a02;font-weight:800;font-size:17px;padding:16px}
.btn.big{height:58px;padding:0;margin-top:12px}
.primary{background:var(--ac);color:#1a0a02;border-radius:12px;padding:12px 16px;font-weight:800;flex:1}
.ghost{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;flex:1}
.danger{color:var(--bad)}
.link{color:var(--mut);font-size:13px;padding:10px 12px;font-weight:600}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(13,17,24,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb));z-index:40}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:700}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
/* plan */
.rot{display:flex;align-items:center;gap:10px;padding:10px;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;position:relative;cursor:pointer}
.rot.next{border-color:var(--ac);box-shadow:0 0 0 1px rgba(255,106,43,.3) inset}
.rn{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--mut);flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:16px}.rt span{display:block;font-size:12.5px;color:var(--mut)}.rt .lastdone{color:var(--dim);margin-top:2px}
.rm{width:84px;flex:none}.badge{position:absolute;top:8px;right:10px;font-style:normal;font-size:10px;font-weight:800;background:var(--ac);color:#1a0a02;padding:2px 8px;border-radius:8px}
.rot .rm{margin-left:auto}.rot.next .rm{margin-top:14px}
.tip{padding:12px;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.tip b{display:block;font-size:14.5px}.tip span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
/* progress */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:800}.stats span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sum .stats{grid-template-columns:repeat(3,1fr)}
.trk{padding:12px 0;border-top:1px solid var(--line)}.trk:first-of-type{border-top:0}
.trk-h{display:flex;gap:10px;align-items:center}.trk-h .th{width:96px;height:72px;flex:none;border-radius:10px;background:#101520;overflow:hidden}
.trk-h b{display:block}.trk-h span{font-size:12.5px;color:var(--mut)}
.steps{list-style:none;padding:0;display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 6px}
.steps li{font-size:11px;padding:4px 9px;border-radius:10px;background:var(--card2);color:var(--dim);font-weight:700}
.steps li.d{color:var(--ok);background:rgba(74,222,128,.1)}.steps li.c{background:var(--ac);color:#1a0a02}
.up{font-size:13px;color:var(--mut);margin:6px 0 10px}.up b{color:var(--text)}
.pb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pb:first-of-type{border-top:0}.pb small{color:var(--dim);margin-left:4px}.pb b{color:var(--ac2);font-weight:700;text-align:right}
.gear{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.gear>div:first-child{min-width:0}.gear b{display:block;font-size:15px}.gear span{font-size:12.5px;color:var(--mut)}
.tog{width:50px;height:30px;border-radius:15px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.2s}
.tog.on{background:var(--ac);border-color:var(--ac)}.tog.on i{left:23px;background:#fff}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .panel{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--sb));border:1px solid var(--line);border-bottom:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:20px;letter-spacing:-.02em}
.bigfig{background:#101520;border-radius:14px;overflow:hidden;margin-bottom:12px;aspect-ratio:4/3}
.bigfig svg{width:100%;height:100%}
.cues{padding-left:20px;margin-top:6px}.cues li{margin:6px 0;font-size:14.5px}
.cues.short{list-style:none;padding:0;margin:8px 0}.cues.short li{font-size:13.5px;color:var(--mut);margin:3px 0;text-align:center}
.facts{display:flex;gap:10px;margin-top:10px}.facts div{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.facts b{display:block;font-size:15px}.facts span{font-size:11px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);background:var(--bg2);border-left:3px solid var(--ac);padding:8px 10px;border-radius:8px;margin-top:10px}
.ex.alt{margin-top:8px}
.ask{width:100%}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));transform:translate(-50%,20px);background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;overflow:auto}
#player.show{display:flex}
.pl-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.pl-top .x{background:var(--card2);flex:none;width:36px;height:36px;font-size:18px;color:var(--mut)}
.pl-top>span{font-size:12px;color:var(--mut);font-weight:700;flex:none}
.pl-prog{flex:1;display:flex;gap:3px}.pl-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.pl-prog i.d{background:var(--ac)}.pl-prog i.c{background:var(--ac2)}
.pl-body{padding:4px 16px calc(24px + var(--sb));max-width:560px;width:100%;margin:0 auto;text-align:center}
.pl-fig{background:#101520;border-radius:18px;overflow:hidden;aspect-ratio:4/3;width:100%;margin:6px 0 12px}
.pl-fig svg{width:100%;height:100%}
.pl-body h2{font-size:24px;letter-spacing:-.02em}
.pl-set{margin-top:12px;display:flex;justify-content:center;gap:10px;align-items:baseline}.pl-set b{font-size:17px;color:var(--ac2)}.pl-set span{color:var(--mut);font-size:13px}
.ctls{display:flex;gap:10px;margin-top:10px}
.ctl{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px}
.ctl button{width:48px;height:56px;font-size:26px;font-weight:700;color:var(--ac2);flex:none}
.ctl>div{flex:1;text-align:center}.ctl b{display:block;font-size:26px;line-height:1.1}.ctl span{font-size:11px;color:var(--mut)}
.ctl.slim{margin-top:8px}.ctl.slim button{font-size:18px;height:46px}
.row.sm{justify-content:center;margin-top:6px}
.ring{position:relative;width:170px;height:170px;margin:14px auto}
.ring.sm{width:130px;height:130px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:var(--card2)}.ring .fg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:800}
.ring small{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:var(--mut);font-size:11px}
.ring.sm span{font-size:38px}
.restwrap{padding:20px 16px;text-align:center;max-width:560px;width:100%;margin:0 auto}
.up-next{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:14px 0}
.up-next .th{width:110px;height:82px;flex:none;border-radius:10px;background:#101520;overflow:hidden}
.up-next span{display:block;font-size:12px;color:var(--mut)}.up-next b{display:block;font-size:17px}
.sum{padding:24px 16px calc(30px + var(--sb));max-width:560px;margin:0 auto;width:100%;text-align:center}
.sum .ok{width:64px;height:64px;border-radius:50%;background:rgba(74,222,128,.15);color:var(--ok);display:grid;place-items:center;font-size:32px;margin:10px auto}
.sum h1{font-size:26px}.sum .card{text-align:left}

#pchip{font-size:12px;font-weight:700;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;align-self:center}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;box-sizing:border-box}
.radio.on{border-color:var(--ac);background:radial-gradient(var(--ac) 42%,transparent 48%)}
.field{width:100%;box-sizing:border-box;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font:inherit;font-size:16px}

.fb{margin:12px 0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.fbq{font-weight:700;font-size:14px;margin-bottom:8px}
.fbr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbr.sub{margin-top:8px}.fbr.sub span{font-size:12.5px;color:var(--mut);margin-right:2px}
.fbb{flex:1;min-width:0;padding:9px 6px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--text)}
.fbb.on{border-color:var(--ac);color:var(--ac)}
.fbc{padding:8px 11px;border-radius:999px;background:var(--bg2);border:1px solid var(--ac);font-weight:700;font-size:13px;color:var(--text)}
.fbn{margin-top:8px;font-size:13px;color:var(--ok);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{padding:8px 12px;background:var(--card2);color:var(--mut);font-weight:700;font-size:13px}.seg button.on{background:var(--ac);color:#fff}

/* wellness */
nav button{min-width:0}
.wintro h1{font-size:24px;margin:2px 0;letter-spacing:-.02em}.wintro p{color:var(--mut);font-size:14px}
.wbig{display:block;width:100%;text-align:left;margin:12px 0 8px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#1f9c8d,#2fd3be);color:#04211d}
.wbig b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}.wbig span{font-size:13px;opacity:.85}
.wq{margin-bottom:6px}.wq button{flex:1;min-width:0;font-size:13px;padding:9px 6px;color:var(--teal)}
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.wtile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.wtile b{display:block;font-size:16px}.wtile span{font-size:12px;color:var(--mut)}
.wtile:active,.wrow:active{background:var(--card2)}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.wrow b{display:block;font-size:15px}.wrow span{font-size:12px;color:var(--mut)}.wrow em{font-style:normal;font-size:12px;color:var(--teal);font-weight:700;white-space:nowrap}
.wback{color:var(--teal);font-weight:700;padding:10px 2px}
.wseg{display:flex;gap:6px;flex-wrap:wrap}.wseg button{flex:1;min-width:64px;padding:10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.wseg button.on{background:var(--teal);color:#04211d;border-color:var(--teal)}
#wplayer{position:fixed;inset:0;z-index:70;display:none;background:radial-gradient(circle at 50% 30%,#12302f,#0b1118 70%)}
#wplayer.show{display:block}
#wplayer.dim{background:#04060a}
.wp{height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + var(--sb));max-width:560px;margin:0 auto}
.wtop{display:flex;justify-content:space-between;align-items:center}.wtop b{font-size:15px;color:var(--mut)}
.wx{padding:8px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.wstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.wcirc{position:relative;width:min(72vw,300px);height:min(72vw,300px);display:flex;align-items:center;justify-content:center}
.wcirc i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(47,211,190,.55),rgba(47,211,190,.12) 70%);border:2px solid rgba(47,211,190,.6);transform:scale(.35);transition:transform .12s linear}
.dim .wcirc i{background:radial-gradient(circle,rgba(120,150,200,.35),rgba(120,150,200,.08) 70%);border-color:rgba(120,150,200,.4)}
.wcl{position:relative;display:flex;flex-direction:column;gap:4px;padding:0 20px}.wcl b{font-size:19px}.wcl span{font-size:34px;font-weight:800;color:var(--teal)}
.dim .wcl span{color:#8fa3c4}
.wstep{padding:0 6px}.wstep h2{font-size:26px;letter-spacing:-.02em;margin-bottom:10px}.wstep p{font-size:18px;line-height:1.45;color:#cfd6e4}

<script>/* ================= FIGURE ENGINE (DOM-free) ================= */
const FL=160;
const SZ={tor:42,th:29,sh:28,ft:12,ua:23,fa:21,hd:4,nk:15,hr:8};
const C={near:'#8493b0',far:'#4d5972',torso:'#97a5c2',head:'#a9b6d0',hand:'#b9c4da',shoe:'#2a3042',
  glowP:'#ff6a2b',glowS:'#ffb54a'};
const D=a=>{const r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)]};
const pt=(p,a,l)=>{const d=D(a);return [p[0]+d[0]*l,p[1]+d[1]*l]};
const f1=n=>(Math.round(n*10)/10);
function ik(P,T,l1,l2,sg){
  const dx=T[0]-P[0],dy=T[1]-P[1];let d=Math.hypot(dx,dy)||.01;
  const dm=Math.max(Math.abs(l1-l2)+.1,Math.min(d,l1+l2-.05));
  const a=(l1*l1-l2*l2+dm*dm)/(2*dm),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const ux=dx/d,uy=dy/d;
  return [P[0]+ux*a-uy*h*sg,P[1]+uy*a+ux*h*sg];
}
function lerpPose(a,b,t){
  const o={};
  for(const k in a){const va=a[k],vb=(k in b)?b[k]:va;
    o[k]=Array.isArray(va)?va.map((x,i)=>x+(vb[i]-x)*t):(typeof va==='number'?va+(vb-va)*t:va);}
  for(const k in b) if(!(k in o)) o[k]=b[k];
  return o;
}
/* ---- limb solving ---- */
function armSolve(S,g,mir,cx){
  const m=mir?-1:1;let E,W,Hd;
  if(g.hand){let h=g.hand;if(mir)h=[2*cx-h[0],h[1]];E=ik(S,h,SZ.ua,SZ.fa,(g.eb??1)*m);W=h;Hd=h;}
  else{E=pt(S,(g.ua??0)*m,SZ.ua);W=pt(E,(g.fa??0)*m,SZ.fa);Hd=pt(W,(g.fa??0)*m,SZ.hd);}
  return {S,E,W,Hd};
}
function legSolve(H,g,mir,cx){
  const m=mir?-1:1;let K,A;
  if(g.ank){let a=g.ank;if(mir)a=[2*cx-a[0],a[1]];K=ik(H,a,SZ.th,SZ.sh,(g.kb??-1)*m);A=a;}
  else{K=pt(H,(g.th??0)*m,SZ.th);A=pt(K,(g.sh??0)*m,SZ.sh);}
  const ft=g.ft??90;
  return {H,K,A,T:pt(A,ft*m,SZ.ft),Hl:pt(A,ft*m,-3.5)};
}
const pick=(P,pre,keys)=>{const g={};for(const k of keys){const v=P[pre+k]!==undefined?P[pre+k]:P[k];if(v!==undefined)g[k]=v;}return g;};
function offs(p,dx,dy){return p?[p[0]+dx,p[1]+dy]:p}
function solve(P,view){
  const H=[P.hx,P.hy],tor=P.tor??180,S=pt(H,tor,SZ.tor),nk=P.neck??tor;
  const hd=pt(S,nk,SZ.nk);
  const R={H,S,hd,tor,nk,view};
  if(view==='side'){
    const ag=pick(P,'',['ua','fa','hand','eb']),lg=pick(P,'',['th','sh','ank','kb','ft']);
    const fag=pick(P,'f',['ua','fa','hand','eb']),flg=pick(P,'f',['th','sh','ank','kb','ft']);
    if(!P.fhand&&ag.hand)fag.hand=offs(ag.hand,-6,0);
    if(!P.fank&&lg.ank)flg.ank=offs(lg.ank,-7,0);
    R.n={arm:armSolve(S,ag,false),leg:legSolve(H,lg,false)};
    const Sf=offs(S,-2.5,-.5),Hf=offs(H,-2.5,-.5);
    R.f={arm:armSolve(Sf,fag,false),leg:legSolve(Hf,flg,false)};
  }else{
    const cx=S[0],w=17;
    const SR=[S[0]+w,S[1]+2],SL=[S[0]-w,S[1]+2],HR=[H[0]+8,H[1]],HL=[H[0]-8,H[1]];
    const ag=pick(P,'',['ua','fa','hand','eb']),lg=pick(P,'',['th','sh','ank','kb','ft']);
    const fag=pick(P,'f',['ua','fa','hand','eb']),flg=pick(P,'f',['th','sh','ank','kb','ft']);
    R.n={arm:armSolve(SR,ag,false,cx),leg:legSolve(HR,lg,false,H[0])};
    R.f={arm:armSolve(SL,fag,true,cx),leg:legSolve(HL,flg,true,H[0])};
    R.SR=SR;R.SL=SL;R.HR=HR;R.HL=HL;
  }
  return R;
}
/* ---- drawing primitives ---- */
const circ=(p,r,f,x='')=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${f}" ${x}/>`;
function limbPath(p,q,r1,r2){
  const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  const A=[p[0]+nx*r1,p[1]+ny*r1],B=[q[0]+nx*r2,q[1]+ny*r2],Cc=[q[0]-nx*r2,q[1]-ny*r2],Dd=[p[0]-nx*r1,p[1]-ny*r1];
  return `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}L${f1(Cc[0])} ${f1(Cc[1])}L${f1(Dd[0])} ${f1(Dd[1])}Z`;
}
function limb(p,q,r1,r2,fill,glow){
  let s=`<path d="${limbPath(p,q,r1,r2)}" fill="${fill}"/>`+circ(p,r1,fill)+circ(q,r2,fill);
  const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;let nx=-dy/l,ny=dx/l;if(ny>0){nx=-nx;ny=-ny;}
  s+=`<line x1="${f1(p[0]+nx*r1*.5)}" y1="${f1(p[1]+ny*r1*.5)}" x2="${f1(q[0]+nx*r2*.5)}" y2="${f1(q[1]+ny*r2*.5)}" stroke="#fff" stroke-opacity=".16" stroke-width="${f1((r1+r2)*.35)}" stroke-linecap="round"/>`;
  if(glow){const c=glow==='p'?C.glowP:C.glowS;
    s+=`<g class="hl ${glow}" fill="${c}"><path d="${limbPath(p,q,r1*.95,r2*.95)}"/>${circ(p,r1*.95,c)}${circ(q,r2*.95,c)}</g>`;}
  return s;
}
function ell(c,rx,ry,deg,cls,fill){return `<ellipse class="hl ${cls}" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${rx}" ry="${ry}" transform="rotate(${f1(deg)} ${f1(c[0])} ${f1(c[1])})" fill="${fill}"/>`;}
const ROLE=(ex,g)=>ex.m.p.includes(g)?'p':(ex.m.s.includes(g)?'s':null);
const gcol=r=>r==='p'?C.glowP:C.glowS;
/* torso-attached muscle overlays (side) */
function torsoGlow(ex,R){
  const d=[Math.sin(R.tor*Math.PI/180),Math.cos(R.tor*Math.PI/180)]; // hip->shoulder
  const deg=Math.atan2(d[1],d[0])*180/Math.PI; // along-torso direction
  const f=[-d[1],d[0]]; // front normal
  const at=(fr,off)=>[R.H[0]+d[0]*SZ.tor*fr+f[0]*off,R.H[1]+d[1]*SZ.tor*fr+f[1]*off];
  let s='';
  for(const g of['chest','back','core','glutes','shoulders']){
    const r=ROLE(ex,g);if(!r)continue;const c=gcol(r);
    if(g==='chest')s+=ell(at(.78,5.5),9,6,deg,r,c);
    if(g==='back'){s+=ell(at(.72,-6),12,5,deg,r,c);s+=ell(at(.28,-6),9,4.5,deg,r,c);}
    if(g==='core')s+=ell(at(.38,6),11,5,deg,r,c);
    if(g==='glutes')s+=ell(at(.02,-6.5),8,7,deg,r,c);
    if(g==='shoulders')s+=`<circle class="hl ${r}" cx="${f1(R.S[0])}" cy="${f1(R.S[1])}" r="7.5" fill="${c}"/>`;
  }
  return s;
}
function sideFigure(ex,R){
  const far=(a,l)=>{
    return limb(l.H,l.K,7.2,5.8,C.far)+limb(l.K,l.A,5.8,4,C.far)+shoe(l,C.shoe,.6)
    +limb(a.S,a.E,5.4,4.4,C.far)+limb(a.E,a.W,4.4,3.2,C.far)+circ(a.Hd,3.4,C.far);
  };
  const near=(a,l)=>{
    const th=ROLE(ex,'quads')||ROLE(ex,'hamstrings'),ca=ROLE(ex,'calves'),
          ua=ROLE(ex,'biceps')||ROLE(ex,'triceps'),fo=ROLE(ex,'forearms');
    let s=limb(l.H,l.K,7.6,6,C.near,th)+limb(l.K,l.A,6,4.2,C.near,ca)+shoe(l,C.shoe,1);
    return {leg:s,arm:limb(a.S,a.E,5.6,4.6,C.near,ua)+limb(a.E,a.W,4.6,3.3,C.near,fo)+circ(a.Hd,3.7,C.hand)};
  };
  let s=far(R.f.arm,R.f.leg);
  const n=near(R.n.arm,R.n.leg);
  s+=limb(R.H,R.S,10,12.3,C.torso)+circ(R.H,10.2,C.torso);
  s+=n.leg;
  s+=torsoGlow(ex,R);
  const d=D(R.nk),fc=[-d[1],d[0]];
  s+=circ(R.hd,SZ.hr,C.head)+circ([R.hd[0]+fc[0]*7.4,R.hd[1]+fc[1]*7.4],2.3,C.head);
  s+=n.arm;
  return s;
}
function shoe(l,fill,sc){
  const a=l.Hl,b=l.T;
  return `<path d="${limbPath(a,b,4.6,3.6)}" fill="${fill}"/>`+circ(a,4.6,fill)+circ(b,3.6,fill);
}
function frontFigure(ex,R,back){
  const near=(a,l,mir,role)=>{
    const th=ROLE(ex,'quads')||ROLE(ex,'hamstrings'),ca=ROLE(ex,'calves'),
          ua=ROLE(ex,'biceps')||ROLE(ex,'triceps'),fo=ROLE(ex,'forearms');
    const c=role==='far'?C.far:C.near;
    const ft=role==='far'?null:1;
    const o=mir?-1:1;
    let s=limb(l.H,l.K,7.4,5.8,c,role==='far'?null:th)+limb(l.K,l.A,5.8,4,c,role==='far'?null:ca);
    s+=`<ellipse cx="${f1(l.A[0]+o*3)}" cy="${f1(l.A[1]+5)}" rx="6.2" ry="3.4" fill="${C.shoe}"/>`;
    let arm=limb(a.S,a.E,5.4,4.4,c,role==='far'?null:ua)+limb(a.E,a.W,4.4,3.2,c,role==='far'?null:fo)+circ(a.Hd,3.6,role==='far'?C.far:C.hand);
    return {leg:s,arm};
  };
  const F=near(R.f.arm,R.f.leg,true,'far'),N=near(R.n.arm,R.n.leg,false,'near');
  let s=F.leg+N.leg;
  // torso trapezoid
  const S=R.S,H=R.H,w=17,pts=[[S[0]-w,S[1]+1],[S[0]+w,S[1]+1],[H[0]+12.5,H[1]],[H[0]-12.5,H[1]]];
  s+=`<path d="M${pts.map(p=>f1(p[0])+' '+f1(p[1])).join('L')}Z" fill="${C.torso}" stroke="${C.torso}" stroke-width="7" stroke-linejoin="round"/>`;
  s+=`<line x1="${f1(S[0]-w*.55)}" y1="${f1(S[1]+4)}" x2="${f1(H[0]-9)}" y2="${f1(H[1]-4)}" stroke="#fff" stroke-opacity=".12" stroke-width="5" stroke-linecap="round"/>`;
  // glows
  const ch=ROLE(ex,'chest'),sh=ROLE(ex,'shoulders'),co=ROLE(ex,'core'),bk=ROLE(ex,'back'),gl=ROLE(ex,'glutes');
  if(!back){
    if(ch){s+=ell([S[0]-8.5,S[1]+10],8.5,6,0,ch,gcol(ch))+ell([S[0]+8.5,S[1]+10],8.5,6,0,ch,gcol(ch));}
    if(co){const y=(S[1]+H[1])/2+6;s+=`<rect class="hl ${co}" x="${f1(S[0]-9)}" y="${f1(y-14)}" width="18" height="30" rx="6" fill="${gcol(co)}"/>`;}
  }else{
    if(bk){s+=`<path class="hl ${bk}" d="M${f1(S[0])} ${f1(S[1]-3)}L${f1(S[0]+19)} ${f1(S[1]+5)}L${f1(S[0]+11)} ${f1(S[1]+30)}L${f1(S[0])} ${f1(H[1]-6)}L${f1(S[0]-11)} ${f1(S[1]+30)}L${f1(S[0]-19)} ${f1(S[1]+5)}Z" fill="${gcol(bk)}"/>`;}
    if(co){s+=`<rect class="hl ${co}" x="${f1(S[0]-10)}" y="${f1(H[1]-14)}" width="20" height="12" rx="5" fill="${gcol(co)}"/>`;}

/* ---- full scene ---- */
function sceneInner(ex,t){
  if(ex.mach&&typeof machScene==='function')return machScene(ex.scn,t,ex.m);
  const P=lerpPose(ex.a,ex.b,t),view=ex.view==='front'||ex.view==='back'?ex.view:'side';
  const R=solve(P,view==='side'?'side':'front');
  const lowX=(R.H[0]);
  let s=P_.floor();
  if(ex.floorMat)s+=P_.mat();
  if(ex.p)s+=ex.p;
  s+=`<ellipse cx="${f1(lowX)}" cy="${FL+1}" rx="44" ry="3.4" fill="#000" opacity=".35"/>`;
  s+=view==='side'?sideFigure(ex,R):frontFigure(ex,R,view==='back');
  if(ex.db){const st=ex.db;
    s+=dbDraw(jointOf(R,'W'),st);
    if(view!=='side')s+=dbDraw(R.f.arm.Hd,st);
    else if(ex.dbBoth)s+=dbDraw(jointOf(R,'fW'),st);
  }
  if(ex.dbAt){s+=dbDraw([R.H[0]+(ex.dbAt[0]||0),R.H[1]+(ex.dbAt[1]||0)],ex.dbStyle||'end');}
  if(ex.ball)s+=ballDraw(jointOf(R,'W'));
  if(ex.band){const b=ex.band;let pts=[];
    if(b.between==='hands'){pts=[R.n.arm.Hd,R.f.arm.Hd];}
    else if(b.between==='knees'){pts=[R.n.leg.K,R.f.leg.K];}
    else{pts=[jointOf(R,b.from)];if(b.via)pts.push(...b.via);pts.push(b.to);}
    s+=bandLine(pts);if(b.to&&!b.between)s+=P_.anchor(b.to[0],b.to[1]);}
  return s;
}

/* animation phase: 0..1 loop -> blend t (with dwell) */
function phaseT(ex,ph){
  if(ex.cyc)return ph;
  if(ex.hold){return .5-.5*Math.cos(ph*Math.PI*2)*.5+.0; }
  const k=ph;let u;
  if(k<.42)u=k/.42;else if(k<.5)u=1;else if(k<.92)u=1-(k-.5)/.42;else u=0;
  return u*u*(3-2*u);
}

    const nx=s.next&&wLookup(s.next);
    h+=`<div class="wdone"><h1>Well done</h1><p>${Math.max(1,Math.round(WP.el/60))} min. Take a moment to notice how you feel.</p><div class="col">${nx?`<button class="primary" data-act="wgo" data-id="${nx.id}" data-m="${nx.def}">Still on edge? Try: ${nx.name.replace(' (5-4-3-2-1)','')}</button>`:''}<button class="${nx?'ghost':'primary'}" data-act="wclose">Done</button></div></div></div>`;
    $('#wplayer').innerHTML=h;return;
  }
  if(WP.phase==='prep'||WP.phase==='intro'){
    const n=s.kind==='guide'?s.steps.length+' steps':'paced breathing';
    h+=`<div class="wstage"><div class="wsn">Get ready</div><div class="wfig">${figEl(s.setup.v,'')}</div><p class="wgoal">${s.goal}</p><p class="wset">${s.setup.t}</p><div class="wnext">${WP.m} min, ${n}</div></div>`;
    h+=WP.phase==='prep'?`<div class="col"><button class="primary" data-act="wbegin">Begin</button></div></div>`:`<div class="wtime" id="wtime">Starting in ${Math.ceil(WP.introLen-WP.intro)}</div><div class="row wctl"><button class="ghost" data-act="wbegin">Start now</button></div></div>`;
    $('#wplayer').innerHTML=h;hook();return;
  }
  const ticks=s.kind==='guide'?WP.tl.segs.slice(1).map(x=>`<u style="left:${(x.t0/WP.total*100).toFixed(2)}%"></u>`).join(''):'';
  h+=`<div class="wstage" id="wstage"></div><div class="wbar"><i id="wbar"></i>${ticks}</div><div class="wtime" id="wtime">${wFmt(WP.total-WP.el)}</div><div class="row wctl"><button class="ghost" data-act="wpause" id="wpb">${WP.paused?'Resume':'Pause'}</button>${s.kind==='guide'?'<button class="ghost" data-act="wskip">Next step</button>':''}</div></div>`;
  $('#wplayer').innerHTML=h;WP.seg=-1;WP.line=-1;wUpdate();
}
function wStage(i){
  const sg=WP.tl.segs[i],n=WP.tl.segs.length;
  $('#wstage').innerHTML=`<div class="wsn">Step ${i+1} of ${n}</div><h2 class="wsh">${sg.title}</h2>${wVis(sg.vis,sg.br)}<p class="wline" id="wline"></p><div class="wnext">${i+1<n?'Next: '+WP.tl.segs[i+1].title:'Last step'}</div>`;hook();
}
function wUpdate(){
  const s=WP.s,el=WP.el;
  const bar=$('#wbar'),tm=$('#wtime');if(!bar)return;
  bar.style.width=Math.min(100,el/WP.total*100)+'%';tm.textContent=wFmt(WP.total-el);
  if(s.kind==='breath'){
    if(!$('#wc'))$('#wstage').innerHTML=`<div class="wcirc"><i id="wc"></i><div class="wcl"><b id="wph"></b><span id="wsec"></span></div></div><p class="wline">${s.cue}</p>`;
    const b=wBreath(s.pat,el);
    $('#wc').style.transform='scale('+(0.35+0.65*b.scale).toFixed(3)+')';$('#wph').textContent=b.label;$('#wsec').textContent=b.sec;
    return;
  }
  const segs=WP.tl.segs;let i=segs.findIndex(x=>el>=x.t0&&el<x.t1);if(i<0)i=segs.length-1;
  if(i!==WP.seg){if(WP.seg>=0)wChime(false);WP.seg=i;WP.line=-1;wStage(i);}
  const sg=segs[i],f=(el-sg.t0)/(sg.t1-sg.t0),li=Math.min(sg.lines.length-1,Math.max(0,Math.floor(f*sg.lines.length)));
  if(li!==WP.line){WP.line=li;const ln=$('#wline');if(ln){ln.classList.remove('in');ln.textContent=sg.lines[li];void ln.offsetWidth;ln.classList.add('in');}}
  if(sg.br){const b=wBreath(sg.br,el-sg.t0),c=$('#wc');if(c){c.style.transform='scale('+(0.35+0.65*b.scale).toFixed(3)+')';$('#wph').textContent=b.label;$('#wsec').textContent=b.sec;}}
}
function wTick(){
  if(!WP||WP.paused||WP.phase==='done'||WP.phase==='prep')return;
  const now=performance.now();const dt=Math.min(2,(now-WP.last)/1000);WP.last=now;
  if(WP.phase==='intro'){WP.intro+=dt;const tm=$('#wtime');if(tm)tm.textContent='Starting in '+Math.max(1,Math.ceil(WP.introLen-WP.intro));if(WP.intro>=WP.introLen)wBegin();return;}
  WP.el+=dt;
  if(WP.el>=WP.total){WP.el=WP.total;wFinish(true);return;}
  wUpdate();
}
function wFinish(full){
  if(!WP)return;
  clearInterval(WP.timer);
  if(WP.el>=30){W().log.push({ts:Date.now(),id:WP.s.id,min:Math.max(1,Math.round(WP.el/60))});if(W().log.length>300)W().log.splice(0,W().log.length-300);save();}

}

function trackOf(id){for(const k in TRACKS){const i=TRACKS[k].steps.indexOf(id);if(i>=0)return {k,i};}return null;}
function resolveTrack(k,used){
  const T=TRACKS[k],lv=Math.min(S.tracks[k],T.steps.length-1);
  const order=[lv];for(let i=lv-1;i>=0;i--)order.push(i);for(let i=lv+1;i<T.steps.length;i++)order.push(i);
  for(const i of order){const e=EX[T.steps[i]];if(e&&avail(e)&&!used.has(e.id))return e;}
  return null;
}
function resolveSlot(slot,used){
  let e=null;
  if(typeof slot==='string'&&slot.startsWith('trk:'))e=resolveTrack(slot.slice(4),used);
  else for(const id of slot.filter(x=>EX[x]).sort((x,y)=>srank(EX[x])-srank(EX[y]))){const c=EX[id];if(c&&avail(c)&&!used.has(c.id)){e=c;break;}}

function planSession(fid,mins,ctx){

  const rest=restFor(mins,F),budget=mins*60,seen=new Set(ctx.used);
  const warm=[],cool=[];
  if(ctx.first&&F.warm&&warmWanted(mins)){const n=mins<=25?1:2;for(const id of F.warm){const e=EX[id];if(e&&e.cardio&&(mins<20||warm.some(w=>w.ex.cardio)))continue;if(e&&avail(e)&&warm.length<n&&!seen.has(id)){warm.push({ex:e,sets:1,rest:0});seen.add(id);}}}
  if(ctx.last&&F.cool&&mins>=20){const n=mins>=40?2:1;for(const id of F.cool){const e=EX[id];if(e&&avail(e)&&cool.length<n&&!seen.has(id)){cool.push({ex:e,sets:1,rest:0});seen.add(id);}}}
  let tot=0;for(const w of warm.concat(cool))tot+=exSec(w.ex,1,0);
  const cands=[];for(const slot of F.slots){const e=resolveSlot(slot,seen);if(e){cands.push(e);seen.add(e.id);}}
  const main=[],base=F.baseSets||2,cap=Math.min(F.maxSets||9,mins>=45?4:3);
  for(const c of cands){const s=exSec(c,base,rest);if(tot+s<=budget||main.length===0){main.push({ex:c,sets:base,rest});tot+=s;}else break;}
  let again=true;
  while(again){again=false;for(const m of main){if(m.sets<cap){const add=workSec(m.ex)+rest;if(tot+add<=budget){m.sets++;tot+=add;again=true;}}}}
  const items=[...warm,...main,...cool].map(it=>({id:it.ex.id,sets:it.sets,rest:it.rest}));
  return {focus:fid,m:mins,est:tot,items};
}
function buildDay(){
  const fid=activeFocus(),used=new Set(),out=[];
  const pend=[];S.plan.sessions.forEach((s,i)=>{if(!s.done&&s.f!=='primer')pend.push(i);});
  const lastPend=pend[pend.length-1];let mainSeen=false;
  S.plan.sessions.forEach((s,i)=>{
    if(s.done){(s.ids||[]).forEach(id=>used.add(id));if(s.f!=='primer')mainSeen=true;out.push({done:true});return;}
    if(s.f==='primer'){out.push(planSession('primer',s.m,{used:new Set(),first:false,last:false}));return;}
    const primerBefore=S.plan.sessions.slice(0,i).some(x=>x.f==='primer');

  });

}

function summaryData(){
  const mins=Math.max(1,Math.round((Date.now()-P.t0)/60000));
  const logged=P.items.filter(it=>it.log.length);
  const bumps=[],ups=[];
  logged.forEach(it=>{
    const e=EX[it.id],full=it.log.length>=it.sets;
    const top=e.kind==='t'?it.log.every(l=>l.t>=e.rng[1]):it.log.every(l=>l.r>=e.rng[1]);
    if(e.w0){const w=it.log[it.log.length-1].w;
      if(full&&top&&!it.adj&&stepW(w,1,e)!==w)bumps.push({id:it.id,from:w,to:stepW(w,1,e)});}
    const tr=trackOf(it.id);
    if(tr&&tr.i===S.tracks[tr.k]&&tr.i<TRACKS[tr.k].steps.length-1&&full&&top)ups.push({k:tr.k,to:EX[TRACKS[tr.k].steps[tr.i+1]].name});
  });
  const sets=logged.reduce((a,it)=>a+it.log.length,0);

  if(k==='gear'){const ids=['dumbbell','bench','tower','band','ball'];b=`<h1>What do you have at home?</h1><p class="hint big">Turn off anything you do not own. Bodyweight moves are always included.</p>${GEAR.filter(g=>ids.includes(g.id)).map(g=>`<div class="gear"><div><b>${g.name}</b><span>${g.sub}</span></div><button class="tog ${S.gear[g.id]?'on':''}" data-act="welgear" data-id="${g.id}" aria-label="toggle ${g.name}"><i></i></button></div>`).join('')}<p class="hint">Going to a gym? Open Gear later and switch to Away to tick machines. Home and Away are kept separate.</p>`;}
  if(k==='prog')b=`<h1>Pick a plan</h1><p class="hint big">Start with the flexible rotation, or follow a fixed weekly program. You can switch whenever you like.</p><div class="gear" data-act="welprog" data-id="" style="cursor:pointer"><div><b>My rotation</b><span>Push, pull, legs, core and full body, sized to the time you have</span></div><i class="radio ${S.prog?'':'on'}"></i></div>${Object.values(PROGS).map(P=>`<div class="gear" data-act="welprog" data-id="${P.id}" style="cursor:pointer"><div><b>${P.name}</b><span>${P.sub}. ${P.goal}</span></div><i class="radio ${S.prog===P.id?'on':''}"></i></div>`).join('')}`;
  if(k==='safe')b=`<h1>Keep your progress safe</h1><div class="card warn"><b>Your progress lives only on this phone</b><p class="hint" style="margin:6px 0 0">It is saved inside the browser, not in the cloud. It will be erased if you clear Chrome's browsing or site data, uninstall or reset Chrome, clear this app's storage, or move to a new phone. The home-screen version of the app on Android shares the same storage as Chrome, so it is not safer.</p></div><p class="hint big">Protect it with a backup file saved outside the browser, for example to Google Drive, OneDrive, email or your Downloads folder.</p><div class="gear"><div><b>Offer a backup after each workout</b><span>One tap to share or save a file. Takes a few seconds.</span></div><button class="tog ${S.bkask?'on':''}" data-act="bktog" data-w="1" aria-label="toggle backup prompt"><i></i></button></div><p class="hint">You can also back up or restore any time: Gear tab, Your data. If data is ever lost, restoring the latest file brings everything back.</p>`;
  if(k==='install')b=`<h1>${isInstalled()?'You are all set':'Add it to your home screen'}</h1>${isInstalled()?`<p class="hint big">You are using the installed app. Open it any time from your home screen.</p>`:`<p class="hint big">For one-tap access: in Chrome tap the three-dot menu, then <b>Add to Home screen</b> (or <b>Install app</b>).</p><div class="card"><p class="hint" style="margin:0">It works offline once it has loaded, so you can train without a signal.</p></div>`}<p class="hint">Tap Start to begin. Your first session is waiting on the Today tab.</p>`;
  const last=WS.i===n-1;
  return `<div class="weli"><div class="wdots">${WSTEPS.map((_,i)=>`<i class="${i===WS.i?'on':i<WS.i?'dn':''}"></i>`).join('')}</div><div class="wbody">${b}</div><div class="wnav">${WS.i>0?'<button class="ghost" data-act="welback">Back</button>':'<span></span>'}<button class="primary" data-act="welnext">${last?'Start':'Next'}</button></div>${last?'':'<button class="wskip" data-act="welskip">Skip for now</button>'}</div>`;
}
function welRender(){let w=document.getElementById('welcome');if(!w){w=document.createElement('div');w.id='welcome';document.body.appendChild(w);document.body.classList.add('lock');}w.innerHTML=welHTML();w.scrollTop=0;}
function welClose(){const w=document.getElementById('welcome');if(w)w.remove();document.body.classList.remove('lock');welMark();render();window.scrollTo(0,0);}
function welOpen(){WS={i:0};welRender();}
Object.assign(ACT,{
 welnext(){if(WSTEPS[WS.i]==='name'){const v=(($('#wname')||{}).value||'').trim();if(v){REGI.list.find(p=>p.id===REGI.active).name=v;saveReg();}}
   if(WS.i>=WSTEPS.length-1){welClose();return;}WS.i++;welRender();},
 welback(){if(WS.i>0){WS.i--;welRender();}},
 welskip(){welClose();},
 welstyle(t){S.style=t.dataset.id;save();welRender();},
 welgear(t){S.gear[t.dataset.id]=S.gear[t.dataset.id]?0:1;S.plan.swaps={};save();welRender();},
 welprog(t){S.prog=t.dataset.id||null;S.plan.focus=null;S.plan.progOff=0;save();welRender();},
 welrestore(){welClose();restoreSheet();},
 welagain(){closeSheet();welOpen();}
});
const _bktog=ACT.bktog;ACT.bktog=function(t){_bktog(t);if(t&&t.dataset&&t.dataset.w)welRender();};
/* first launch: show unless this device has been through it or already has workout history */
(function(){if(welDone())return;if(S.logs&&S.logs.length){welMark();return;}welOpen();})();

</script></body></html>
